<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نیاز مردمی</title>
<meta name="theme-color" content="#1a5bb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="نیاز مردمی">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#222;--mut:#777;--blue:#1a5bb5;--blue-l:#e6eefa;--green:#1b7a3d;--green-l:#e0f0e5;--line:#dcdcd8}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--ink:#eee;--mut:#9a9a9a;--blue:#4a8be0;--blue-l:#1d2a40;--green:#6fcf8e;--green-l:#173222;--line:#383838}}
*{box-sizing:border-box;margin:0;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
html,body{background:var(--bg);color:var(--ink)}
body{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px 90px}
h1{font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;min-height:112px}
.cat .e{font-size:30px}.cat b{display:block;font-size:14px;margin:6px 0 2px}.cat small{color:var(--mut);font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:22px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;padding:14px;margin:14px 0;cursor:pointer}
.btn.sec{background:var(--blue-l);color:var(--blue)}
.banner{background:var(--green-l);color:var(--green);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.banner b{font-size:16px}.banner small{display:block;margin-top:3px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px;margin-bottom:10px}
.search{margin:0 0 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.tab{padding:12px;text-align:center;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:700}
.tab.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid var(--line)}
.item.on{border-color:var(--blue);background:var(--blue-l)}
.item .e{font-size:26px}.item small{color:var(--mut);display:block}
.chip{padding:10px 6px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.chip.on{background:var(--blue-l);border-color:var(--blue)}
.post{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;border:1px solid var(--line)}
.post small{color:var(--mut)}
.back{background:var(--card);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;color:var(--ink)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--mut);cursor:pointer}
nav button span{display:block;font-size:22px}nav button.on{color:var(--blue);font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9}
.mut{color:var(--mut);font-size:14px;margin:6px 0 10px}
.like{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;margin-top:8px}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue);border-radius:10px;padding:2px 8px;font-size:12px;margin-inline-end:6px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
const CATS=[
["food","🍞","غذا","خوراک، کشاورزی، گرونی"],["cloth","👕","پوشاک","لباس، کفش، تولید"],
["home","🏠","مسکن","خرید، اجاره، تعمیر"],["car","🚗","حمل و نقل","ماشین، ترافیک، بار"],
["health","❤️","سلامت، درمان و فرهنگ‌سازی","دارو، پزشک، روان، آگاهی"],["mobile","📱","موبایل و ارتباطات","گوشی، اینترنت، سیم‌کارت"],
["energy","⚡","آب، گاز، برق","قطعی، قبض، صرفه‌جویی"],["travel","✈️","تفریح، سرگرمی و سفر","گردش، ورزش، تور"],
["nature","🌿","طبیعت و بازیافت","پسماند، محیط‌زیست"],["tech","🤖","فناوری، هوش مصنوعی و ربات","ابزار، اتوماسیون"],
["safe","🛡️","امنیت","حوادث، کلاهبرداری، دزدی، هکر"],["idea","💡","افکار متفاوت","ایده‌های نو، راه‌حل‌ها"]];
const LEARN=[["ind","⚙️","صنعتی، فنی‌مهندسی و تعمیرات"],["code","💻","کامپیوتر و برنامه‌نویسی"],["lang","🔤","زبان"],
["edu","📚","درسی و کنکور"],["art","🎨","هنر و صنایع‌دستی"],["cook","👨‍🍳","آشپزی و شیرینی"],
["farm","🌱","کشاورزی"],["biz","💼","کسب‌وکار و فروش"],["sport","🏋️","ورزش"]];
const ROLES=[["idea","💡","ایده‌ساز","ایده و راه‌حل جدید دارم"],["maker","🛠️","مخترع و خلق‌کننده","می‌سازم و تولید می‌کنم"],
["invest","💰","سرمایه‌گذاری","برای پروژه‌ها سرمایه دارم"],["sales","📈","تیم فروش","محصول رو به مردم می‌رسونم"]];
const FORMS=["حضوری","آنلاین","ویدیویی"];

let S={posts:[],user:null,learn:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("niaz")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("niaz",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
let pt=0,amt=10000,view="home",arg=null,q="",tab=0,form=null,roles=new Set();

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function go(v,a){view=v;arg=a||null;render();scrollTo(0,0)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function home(){
  const list=CATS.filter(c=>(c[2]+c[3]).includes(q));
  return `<div class="top"><h1>نیاز مردمی</h1></div>
  <input class="search" id="q" placeholder="🔍 جستجوی نیاز…" value="${esc(q)}">
  <div class="grid">${list.map(c=>`<div class="cat" onclick="go('cat','${c[0]}')"><div class="e">${c[1]}</div><b>${c[2]}</b><small>${c[3]}</small></div>`).join("")}</div>
  ${list.length?"":'<div class="empty">نیازی با این عنوان پیدا نشد</div>'}
  <button class="btn" onclick="go('reg')">${S.user?"ویرایش ثبت‌نام":"ثبت‌نام"}</button>
  <div class="banner"><span style="font-size:34px">🤝</span><div><b>هر ایرانی به تو نیاز داره</b><small>کمک خیر: ۱٬۰۰۰ تا ۱۰۰٬۰۰۰ تومان</small></div></div>`;
}
function cat(){
  const c=CATS.find(x=>x[0]===arg),ps=S.posts.filter(p=>p.c===arg);
  return `<div class="top"><button class="back" onclick="go('home')">➡️</button><h1>${c[1]} ${c[2]}</h1></div>
  <div class="row" style="margin-bottom:10px"><div class="tab ${pt?'':'on'}" onclick="pt=0;render()">نیاز دارم</div><div class="tab ${pt?'on':''}" onclick="pt=1;render()">ایده / راه‌حل دارم</div></div>
  <input id="t" placeholder="عنوان">
  <textarea id="d" rows="3" placeholder="توضیح کوتاه…"></textarea>
  <button class="btn" onclick="addPost()">ثبت</button>
  <div class="mut">${ps.length} مورد ثبت‌شده</div>
  ${ps.length?ps.map(p=>`<div class="post"><span class="tag">${p.k?"ایده":"نیاز"}</span><b>${esc(p.t)}</b><p>${esc(p.d)}</p><small>${p.by} • ${p.date}</small><br><button class="like" onclick="like(${S.posts.indexOf(p)})">🙋 من هم ${p.k?"موافقم":"نیاز دارم"} (${p.n||0})</button> <button class="like" onclick="delP(${S.posts.indexOf(p)})">🗑️</button></div>`).join(""):'<div class="empty">هنوز موردی ثبت نشده. اولین نفر باش.</div>'}`;
}
function addPost(){
  const t=$("#t").value.trim();if(!t)return toast("عنوان را بنویس");
  S.posts.unshift({c:arg,k:pt,n:0,t,d:$("#d").value.trim(),by:S.user?S.user.name:"ناشناس",date:new Date().toLocaleDateString("fa-IR")});
  save();toast("ثبت شد ✅");render();
}
function like(i){S.posts[i].n=(S.posts[i].n||0)+1;save();render()}
function delP(i){if(confirm("حذف شود؟")){S.posts.splice(i,1);save();render()}}
function help(){
  const A=[1000,5000,10000,50000,100000];
  return `<div class="top"><h1>🤝 کمک خیر</h1></div>
  <div class="banner" style="margin-bottom:12px"><div><b>هر ایرانی به تو نیاز داره</b><small>با مبلغ کم هم می‌شه کنار هم گره‌ای باز کرد.</small></div></div>
  <div class="mut">مبلغ (تومان)</div>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr">${A.map(a=>`<div class="chip ${amt===a?'on':''}" onclick="amt=${a};render()">${a.toLocaleString('fa-IR')}</div>`).join("")}</div>
  <button class="btn" onclick="S.helps=(S.helps||0)+1;save();toast('نیتت ثبت شد 💚')">ثبت قصد کمک</button>
  <div class="mut">⚠️ نسخه‌ی نمایشی: پرداخت واقعی بعد از اتصال به درگاه معتبر و مشخص‌شدن گیرنده‌ی کمک فعال می‌شود.</div>`;
}
function me(){
  const u=S.user,mine=S.posts.filter(p=>u&&p.by===u.name).length;
  return `<div class="top"><h1>👤 من</h1></div>
  ${u?`<div class="post"><b>${esc(u.name)}</b><p>${u.roles.map(r=>ROLES.find(x=>x[0]===r)[2]).join("، ")}</p><small>${mine} مورد ثبت‌شده</small></div>`:'<div class="empty">هنوز ثبت‌نام نکردی</div>'}
  <button class="btn" onclick="go('reg')">${u?"ویرایش نقش‌ها":"ثبت‌نام"}</button>
  <div class="mut">پشتیبان‌گیری از داده‌ها (برای انتقال به نسخه‌ی جدید)</div>
  <button class="btn sec" onclick="exp()">⬇️ دانلود پشتیبان</button>
  <button class="btn sec" onclick="$('#f').click()">⬆️ بازیابی پشتیبان</button>
  <input type="file" id="f" accept=".json" hidden onchange="imp(this.files[0])">`;
}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="niaz-backup.json";a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();toast("بازیابی شد ✅");render()}catch(e){toast("فایل معتبر نیست")}};r.readAsText(f)}
function learn(){
  const items=tab?LEARN.filter(l=>S.learn.includes(l[0])||true):LEARN;
  return `<div class="top"><h1>آموزش</h1></div>
  <div class="row" style="margin-bottom:12px"><div class="tab ${tab?'':'on'}" onclick="tab=0;render()">آموزش‌دهنده‌ها</div><div class="tab ${tab?'on':''}" onclick="tab=1;render()">می‌خواهم یاد بگیرم</div></div>
  <div class="mut">${tab?"موضوع‌هایی که می‌خوای یاد بگیری را انتخاب کن":"موضوعی که می‌توانی آموزش بدهی را انتخاب کن"}</div>
  ${LEARN.map(l=>`<div class="item ${S.learn.includes(l[0]+tab)?'on':''}" onclick="togL('${l[0]}${tab}')"><span class="e">${l[1]}</span><b>${l[2]}</b></div>`).join("")}
  <div class="mut">شکل آموزش</div>
  <div class="row">${FORMS.map(f=>`<div class="chip ${form===f?'on':''}" onclick="form='${f}';render()">${f}</div>`).join("")}</div>
  <button class="btn" onclick="saveL()">ذخیره</button>`;
}
function togL(k){const i=S.learn.indexOf(k);i<0?S.learn.push(k):S.learn.splice(i,1);render()}
function saveL(){save();toast("ذخیره شد ✅")}
function reg(){
  return `<div class="top"><button class="back" onclick="go('home')">➡️</button><h1>ثبت‌نام</h1><span style="width:40px"></span></div>
  <div class="mut">نقش (یا نقش‌های) خودت را انتخاب کن</div>
  ${ROLES.map(r=>`<div class="item ${roles.has(r[0])?'on':''}" onclick="togR('${r[0]}')"><span class="e">${r[1]}</span><div><b>${r[2]}</b><small>${r[3]}</small></div></div>`).join("")}
  <input id="n" placeholder="نام" value="${S.user?esc(S.user.name):''}">
  <input id="p" type="tel" placeholder="شماره تماس" value="${S.user?esc(S.user.phone):''}">
  <div class="mut">🔒 شماره‌ات فقط برای ارتباط درباره‌ی همین نیازها استفاده می‌شود.</div>
  <button class="btn" onclick="saveR()">ادامه</button>`;
}
function togR(k){roles.has(k)?roles.delete(k):roles.add(k);render()}
function saveR(){
  const name=$("#n").value.trim();if(!roles.size)return toast("حداقل یک نقش انتخاب کن");if(!name)return toast("نام را بنویس");
  S.user={name,phone:$("#p").value.trim(),roles:[...roles]};save();toast("ثبت‌نام شد ✅");go("home");
}
function render(){
  $("#app").innerHTML={home,cat,learn,reg,help,me}[view]();
  const q_=$("#q");if(q_){q_.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
  const t=view==="reg"?"me":view==="cat"?"home":view;
  $("#nav").innerHTML=[["home","🏠","نیازها"],["learn","🎓","آموزش"],["help","🤝","کمک"],["me","👤","من"]].map(n=>`<button class="${n[0]===t?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("");
}
if(S.user)S.user.roles.forEach(r=>roles.add(r));
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
